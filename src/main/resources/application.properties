spring.application.name=levelup-backend
server.port=8081

# Base de datos MySQL (se puede sobreescribir con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/levelup?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# JWT
app.jwt.secret=${JWT_SECRET:levelup-clave-secreta-solo-para-desarrollo-cambiar-en-produccion-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

# Datos iniciales
app.seed.enabled=true
app.seed.password=${SEED_PASSWORD:Level2026!}
